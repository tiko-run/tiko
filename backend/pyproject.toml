[project]
name = "tiko-api"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "prometheus-client>=0.26",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "pycrdt>=0.14.8",
    "sentry-sdk>=2.40",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
