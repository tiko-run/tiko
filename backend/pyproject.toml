[project]
name = "tiko-api"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16.2",
    "prometheus-client>=0.26",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "pycrdt>=0.14.10",
    "sentry-sdk>=2.73.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.2",
    "pillow>=12",
    "icalendar>=7",
    "rlottie-python>=1.3.8",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
