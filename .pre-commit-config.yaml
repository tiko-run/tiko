# Installed by `launch new` / `launch publish`; by hand: pre-commit install
# Fast checks on commit, the full `make check` gate on push (same as CI).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
# Vendored skills keep upstream bytes; refresh them with `launch update`, not by hand.
exclude: ^\.claude/skills/(hallmark|impeccable)/
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - { id: trailing-whitespace }
      - { id: end-of-file-fixer }
      # Bundled CC0 music tracks are 2-3 MB each, so they skip the size check.
      - { id: check-added-large-files, args: ["--maxkb=2000"], exclude: ^frontend/public/music/ }
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - { id: ruff, args: [--fix], files: ^(backend|updater)/ }
      - { id: ruff-format, files: ^(backend|updater)/ }
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
