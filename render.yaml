# Render Blueprint behind the "Deploy to Render" button: released images, boards in Render Postgres.
# Validate: make render-validate. Spec: https://render.com/docs/blueprint-spec
# The services live in a project of their own, so they do not land among "Ungrouped Services".
projects:
  - name: tiko
    environments:
      - name: production
        services:
          # Private: reachable only from tiko-web, so the API never faces the internet on its own.
          - type: pserv
            name: tiko-api
            runtime: image
            image:
              url: ghcr.io/tiko-run/tiko-api:latest
            plan: starter  # a disk needs a paid plan
            region: frankfurt
            autoDeployTrigger: "off"
            # Backups and the SQLite file of an earlier release, copied into Postgres at its first start.
            disk:
              name: data
              mountPath: /app/data
              sizeGB: 1
            envVars:
              - key: PORT
                value: "8000"
              - key: DATABASE_URL
                fromDatabase:
                  name: tiko-db
                  property: connectionString
              # Sign in as admin with this value from the service's Environment tab.
              - key: TIKO_PASSWORD
                generateValue: true
              - key: TIKO_SECRET_KEY
                generateValue: true

          - type: web
            name: tiko-web
            runtime: image
            image:
              url: ghcr.io/tiko-run/tiko-web:latest
            plan: starter
            region: frankfurt
            autoDeployTrigger: "off"
            healthCheckPath: /
            envVars:
              - key: PORT
                value: "3000"
              - key: API_UPSTREAM
                fromService:
                  type: pserv
                  name: tiko-api
                  property: hostport

        databases:
          - name: tiko-db
            plan: 0.1c-256mb
            region: frankfurt
            postgresMajorVersion: "18"
            databaseName: tiko
            # Reached only from the services of this blueprint, never from outside Render.
            ipAllowList: []
