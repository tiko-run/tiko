# On a version tag (CalVer vYYYY.M.D, made by `make release`): publish container images to GHCR
# and a GitHub Release with the version's section of CHANGELOG.md as notes.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  discussions: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, updater]
        include:
          - { service: api, context: backend }
          - { service: web, context: frontend }
          - { service: updater, context: updater }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            # A release candidate (v…-rc.N) never becomes latest.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc.') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A release candidate carries what Unreleased says at its commit.
          case "$version" in *-rc.*) section=Unreleased ;; *) section="$version" ;; esac
          awk -v v="$section" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $section"; exit 1; }
      # install.sh downloads this asset; TAG defaults to this release instead of latest.
      - name: Compose file pinned to this release
        run: mkdir pinned && sed "s/\${TAG:-latest}/\${TAG:-${GITHUB_REF_NAME#v}}/" compose.release.yml > pinned/compose.release.yml && grep -q "${GITHUB_REF_NAME#v}" pinned/compose.release.yml
      # A candidate is a GitHub pre-release: releases/latest, About and the updater skip it.
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then extra=(--prerelease); else extra=(--discussion-category Announcements); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${extra[@]}" pinned/compose.release.yml
        env:
          GH_TOKEN: ${{ github.token }}
