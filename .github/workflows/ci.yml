name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build -d --wait
      # A throwaway stack: smoke may change the first admin's password away and back.
      - run: SMOKE_FIRST_PASSWORD=1 make smoke
      - run: docker build -q updater
      - if: failure()
        run: docker compose logs --tail=100

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make licenses

  # The released images through install.sh, twice: a fresh install, then an upgrade.
  installer:
    runs-on: ubuntu-latest
    env:
      TIKO_DIR: /tmp/tiko-install
      # CI installs are not installs: they stay out of the usage stats.
      TIKO_USAGE_STATS: "false"
      TIKO_COMPOSE_URL: file://${{ github.workspace }}/compose.release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -s sh install/install.sh
      - run: shellcheck -s sh frontend/real-ip.envsh scripts/test-real-ip.sh
      - run: sh install/install.sh --yes --port 3100
      - name: Sign in with the generated password
        run: |
          password=$(sed -n 's/^TIKO_PASSWORD=//p' "$TIKO_DIR/.env")
          curl -fsS -o /dev/null -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}" http://127.0.0.1:3100/api/auth/login
      - name: Backups land in data/backups
        run: |
          for _ in $(seq 60); do ls "$TIKO_DIR"/data/backups/auto-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls "$TIKO_DIR"/data/backups/auto-*.dump "$TIKO_DIR"/data/backups/daily-*.dump
          docker compose -f "$TIKO_DIR/compose.yaml" exec -T backup tiko-dump
          docker compose -f "$TIKO_DIR/compose.yaml" exec -T backup sh -c 'pg_restore -l /backups/manual-*.dump' | grep -q 'TABLE DATA public users'
      - run: cp "$TIKO_DIR/.env" env.before && sh install/install.sh --yes && cmp env.before "$TIKO_DIR/.env"
      - if: failure()
        run: docker compose -f "$TIKO_DIR/compose.yaml" logs --tail=100

  # The one required status check for main; add new jobs to `needs`.
  gate:
    name: CI Gate
    if: always()
    needs: [check, smoke, licenses, installer]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
