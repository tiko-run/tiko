# Build the user guide in docs/guide on every change; publish it to GitHub Pages from main.
name: docs
on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "install/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/guide/**", "install/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/guide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Runner images lag behind Node releases; Astro needs the newest 22.x.
          check-latest: true
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json
      - run: npm ci
      # The installers are served next to the guide, so the published ones are always main's.
      - run: cp ../../install/install.sh ../../install/install.ps1 public/
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/guide/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
